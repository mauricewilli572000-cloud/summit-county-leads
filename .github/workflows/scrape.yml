name: Summit County Lead Scrape

on:
  schedule:
    - cron: "30 10,22 * * *"   # twice daily (~6:30 AM / 6:30 PM Eastern); the Clerk feed only shows the last day or two
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scrape-and-pages"
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install OCR tools (some title reports are scanned images)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils

      - name: Install Chromium (the clerk feed is JavaScript-rendered)
        run: python -m playwright install --with-deps chromium

      - name: Run offline tests
        run: python -m pytest -q tests

      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cd src
          python run_pipeline.py

      - name: Commit and push updated leads + dashboard data
        run: |
          git config user.name "summit-lead-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/leads.json dashboard/summit.json dashboard/summit_ghl_export.csv
          git add data/doc_debug 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Summit lead scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi

      - name: Upload debug page (what the scraper actually saw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summit-last-feed
          path: data/last_feed.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload dashboard artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy-pages:
    needs: scrape
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
